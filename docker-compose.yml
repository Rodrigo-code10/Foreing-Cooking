services:
  # mongodb:
  #   image: mongo:latest
  #   ...

  api:
    build: ./api
    container_name: api_srv
    restart: always
    # depends_on:
    #   - mongodb
    environment:
      MONGO_URI: ${MONGO_URI}
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
    ports:
      - "${API_PORT}:3000"
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    command: ["npm", "run", "dev"]
    networks:
      - services_net

  web:
    image: php:8.3-apache
    container_name: web_foreign_cooking
    volumes:
      - ./web:/var/www/html
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - api
    restart: always
    networks:
      - services_net

networks:
  services_net:
    driver: bridge
