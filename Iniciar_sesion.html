<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo3.css">
    <title>Iniciar Sesión</title>
</head>
<body>
    <div class="login-container">
        <div class="login-form-section">
            <h2>Iniciar Sesión</h2>
            <p class="subtitle">Use su correo y contraseña</p>
            
            <form action="index.html"><!-- Aqui pondra cuando ya inicio sesion el stakeholder-->
                <div class="input-group email">
                    <input type="text" name="email" placeholder="Correo" required>
                </div>
                
                <div class="input-group password">
                    <input type="password" name="password" placeholder="Contraseña" required>
                </div>
                
                <button type="submit" class="login-btn">Iniciar Sesión</button>
            </form>
        </div>

        <div class="welcome-section">
            <div class="logo-container">
                <a href="index.html">
                    <img src="src/Logo.png" alt="Foreign Cooking Logo" class="logo-image">
                </a>
            </div>
            <h1>¡Bienvenido!</h1>
            <p>Ingrese sus datos personales para usar<br>todas las funciones del sitio</p>
            <a href="Cat_recetas.html"><button class="register-btn">Registrarse</button></a><!--Si prefiere mejor registrarse-->
        </div>
    </div>



</body>
</html>
